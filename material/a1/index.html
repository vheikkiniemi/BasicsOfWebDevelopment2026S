<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">

    <title>Centria Edu | Basics of Web Development<title>

    <style>
        :root {
            --primary: #e10e49;
            --light: #ffffff;
            --dark: #1e1e1e;
            --blue: #263f6a;
            --green: #284e36;
            --orange: #e37222;
            --rose: #c24d52;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid #e5e5e5;
        }

        .container {
            width: min(1100px, 90%);
            margin: 0 auto;
        }

        nav {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--dark);
        }

        .logo span {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav a {
            color: var(--dark);
            text-decoration: none;
        }

        nav a:hover {
            color: var(--primary);
        }

        .hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 700px;
        }

        .label {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08rem;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1.05;
        }

        .hero p {
            max-width: 600px;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 0.9rem 1.4rem;
            background-color: var(--primary);
            color: var(--light);
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .button:hover {
            background-color: var(--rose);
        }

        .topics {
            padding: 5rem 0;
            background-color: #f7f7f7;
        }

        .topics h2 {
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .card {
            padding: 2rem;
            background-color: var(--light);
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        .card h3 {
            margin-bottom: 0.8rem;
        }

        .card:nth-child(1) {
            border-top: 4px solid var(--blue);
        }

        .card:nth-child(2) {
            border-top: 4px solid var(--green);
        }

        .card:nth-child(3) {
            border-top: 4px solid var(--orange);
        }

        footer {
            padding: 2rem 0;
            background-color: var(--dark);
            color: var(--light);
        }

        @media (max-width: 700px) {
            nav ul {
                display: none;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .hero {
                min-height: 60vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#topics">Topics</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <div class="hero-content">

                    <span class="label">Basics of Web Development</span>

                    <h1>
                        Learn how the web works.
                    </h1>

                    <p>
                        Start from HTML and CSS and gradually build modern,
                        responsive and interactive web applications.
                    </p>

                    <a href="#topics" class="button">
                        Start learning
                    </a>

                </div>
            </div>
        <section>

        <section class="topics" id="topics">
            <div class="container">

                <h2>What we will learn</h2>

                <div class="cards">

                    <article class="card">
                        <h3>HTML</h3>
                        <p>
                            Learn how to structure web pages using semantic HTML.
                        </p>
                    </article>

                    <article class="card">
                        <h3>CSS</h3>
                        <p>
                            Learn how to style layouts, colors, typography and
                            responsive interfaces.
                        </p>
                    </article>

                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>
</html>
